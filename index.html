<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amethyst Library</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1>Amethyst Library</h1>
        <button id="add-btn" class="plus-btn">+</button>
    </header>

    <main id="app-content">
        <section id="view-unread" class="view"><h2>Unread</h2><div class="list"></div></section>
        <section id="view-progress" class="view" style="display:none"><h2>In Progress</h2><div class="list"></div></section>
        <section id="view-read" class="view" style="display:none"><h2>Read</h2><div class="list"></div></section>
        <section id="view-wishlist" class="view" style="display:none"><h2>Wishlist</h2><div class="list"></div></section>
        <section id="view-stats" class="view" style="display:none">
            <h2>Stats</h2>
            <select id="stats-year-select"></select>
            <div id="stats-container"></div>
        </section>
        <section id="view-achievements" class="view" style="display:none"><h2>Achievements</h2><div class="list"></div></section>
    </main>

    <nav class="bottom-nav">
        <button onclick="showView('unread')">📚</button>
        <button onclick="showView('progress')">📖</button>
        <button onclick="showView('read')">✅</button>
        <button onclick="showView('stats')">📊</button>
        <button onclick="showView('achievements')">🏆</button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
