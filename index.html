<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumina Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Lumina</h1>
    <button onclick="exportData()" class="btn-text">BACKUP</button>
</header>

<div class="search-container">
    <input type="text" id="globalSearch" placeholder="Search books or achievements..." oninput="render()">
</div>

<main id="app-content">
    <div id="unread" class="view active"></div>
    <div id="in-progress" class="view"></div>
    <div id="completed" class="view"></div>
    <div id="wishlist" class="view"></div>
    
    <div id="achievements" class="view">
        <h3 class="view-title">Achievements</h3>
        <div class="achievements-grid" id="achievementsGrid">
            <div class="achievement-card" id="ach-1" data-name="First Book">📖 First Book</div>
            <div class="achievement-card" id="ach-5" data-name="5 Books Read">📚 5 Books Read</div>
            <div class="achievement-card" id="ach-10" data-name="Scholar 10 books">🎓 Scholar (10)</div>
            <div class="achievement-card" id="ach-wish" data-name="Dreamer Wishlist">✨ Dreamer (Wishlist)</div>
        </div>
    </div>
</main>

<nav class="bottom-nav">
    <button onclick="showView('unread')" id="nav-unread" class="active">⭕<span>Unread</span></button>
    <button onclick="showView('in-progress')" id="nav-in-progress">⏳<span>Reading</span></button>
    <button onclick="showView('completed')" id="nav-completed">✅<span>Done</span></button>
    <button onclick="showView('wishlist')" id="nav-wishlist">⭐<span>Wish</span></button>
    <button onclick="showView('achievements')" id="nav-achievements">🏆<span>Awards</span></button>
</nav>

<button class="fab" onclick="openModal()">+</button>

<div id="bookModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Add New Book</h2>
        <input type="hidden" id="editId">
        
        <label>List Type</label>
        <select id="type" onchange="toggleWishlistFields()">
            <option value="library">My Library</option>
            <option value="wishlist">Wishlist</option>
        </select>

        <label>Book Title</label>
        <input type="text" id="title">
        
        <label>Cover URL</label>
        <input type="text" id="cover">
        
        <div id="libraryFields">
            <div class="input-row">
                <div>
                    <label>Total Pages</label>
                    <input type="number" id="totalPages">
                </div>
                <div>
                    <label>Current Page</label>
                    <input type="number" id="currentPage">
                </div>
            </div>
        </div>

        <div id="wishlistFields" style="display: none;">
            <label>Price (£)</label>
            <input type="number" id="price" step="0.01" placeholder="0.00">
            <label>Purchase Link</label>
            <input type="url" id="buyLink" placeholder="https://amazon.com/...">
        </div>

        <button class="btn-main" onclick="saveBook()">Save Changes</button>
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
